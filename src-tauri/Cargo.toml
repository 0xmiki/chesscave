[package]
name = "chesscave"
version = "0.1.0"
description = "A desktop app for playing, reviewing, and practicing chess."
license = "MIT"
publish = false
edition = "2021"

[lib]
# Keep the library name separate from the binary name for Windows builds.
name = "chesscave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "sync", "time"] }
reqwest = { version = "0.13", features = ["json"] }
